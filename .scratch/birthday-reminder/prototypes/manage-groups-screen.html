<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manage Groups prototype — Birthday Reminder</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --text:#e8eaf0; --muted:#9aa3b2; --accent:#5b8cff; --red:#ff5c7a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); }
  .phone { max-width:390px; margin:0 auto; min-height:100vh; background:var(--bg); position:relative; padding-bottom:90px; border-left:1px solid #222; border-right:1px solid #222; }
  .muted { color:var(--muted); }
  .header { padding:14px; display:flex; align-items:center; justify-content:space-between; }
  .header .title { font-size:20px; font-weight:800; }
  .header .add { background:var(--accent); color:#fff; border:none; width:34px; height:34px; border-radius:10px; font-size:20px; cursor:pointer; }
  .section-title { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:8px 14px; }
  .list { margin:0 14px; }
  .group-row { display:flex; align-items:center; gap:12px; padding:14px; background:var(--panel); border:1px solid #262b35; border-radius:14px; margin-bottom:8px; }
  .group-row .gname { font-weight:700; font-size:15px; }
  .group-row .gcount { font-size:12px; color:var(--muted); margin-top:2px; }
  .group-row .del { margin-left:auto; background:transparent; border:none; color:var(--red); font-size:16px; cursor:pointer; }
  .empty { text-align:center; color:var(--muted); padding:40px 14px; font-size:14px; }
  .switcher { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:14px; background:#2a2f3a; border:1px solid #3a4150; padding:10px 16px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:99; }
  .switcher button { background:var(--accent); color:#fff; border:none; width:30px; height:30px; border-radius:50%; font-size:16px; cursor:pointer; }
  .switcher .label { font-size:13px; font-weight:700; min-width:170px; text-align:center; }
</style>
</head>
<body>
  <div class="phone" id="app"></div>
  <div class="switcher">
    <button id="prev">←</button>
    <span class="label" id="label"></span>
    <button id="next">→</button>
  </div>
<script>
  const VARIANTS = ['A','B'];
  const NAMES = { A:'Simple list + delete', B:'Delete with confirm' };
  const params = new URLSearchParams(location.search);
  let current = params.get('variant') || 'A';
  if (!VARIANTS.includes(current)) current = 'A';

  const groups = [
    { name:'Family', count:2 },
    { name:'Friends', count:2 },
    { name:'Work', count:1 },
  ];

  function render() {
    const app = document.getElementById('app');
    app.className = current;
    document.getElementById('label').textContent = current + ' — ' + NAMES[current];
    app.innerHTML = variant();
    params.set('variant', current);
    history.replaceState({}, '', '?' + params.toString());
  }

  function groupRow(g, confirmDel) {
    return `
      <div class="group-row">
        <div>
          <div class="gname">${g.name}</div>
          <div class="gcount">${g.count} people</div>
        </div>
        <button class="del" data-del="${g.name}">${confirmDel ? 'Delete' : '🗑'}</button>
      </div>`;
  }

  function variant() {
    const confirmDel = current === 'B';
    const rows = groups.length
      ? groups.map(g=>groupRow(g, confirmDel)).join('')
      : `<div class="empty">No groups yet.<br/>Tap + to create your first group.</div>`;
    return `
      <div class="header">
        <div class="title">Manage Groups</div>
        <button class="add" title="New group">+</button>
      </div>
      <div class="section-title">Your groups</div>
      <div class="list">${rows}</div>
    `;
  }

  document.getElementById('prev').onclick = ()=>{ current = VARIANTS[(VARIANTS.indexOf(current)+VARIANTS.length-1)%VARIANTS.length]; render(); };
  document.getElementById('next').onclick = ()=>{ current = VARIANTS[(VARIANTS.indexOf(current)+1)%VARIANTS.length]; render(); };
  document.addEventListener('keydown', (e)=>{
    if (['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable) return;
    if (e.key === 'ArrowLeft') document.getElementById('prev').click();
    if (e.key === 'ArrowRight') document.getElementById('next').click();
  });
  render();
</script>
</body>
</html>
